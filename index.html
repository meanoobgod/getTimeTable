<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time Table Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 25%, #6d28d9 55%, #db2777 80%, #f59e0b 100%);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---- white container, single column ---- */
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 36px 32px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .card h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: -.4px;
    color: #14161d;
    text-align: center;
  }

  .card .sub {
    margin: -8px 0 4px;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  label {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    letter-spacing: .3px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 13px 14px;
    font-size: 15px;
    color: #111827;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }

  input[type="text"]:focus, select:focus {
    border-color: #6d28d9;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(109, 40, 217, .15);
  }

  /* ---- submit: light shade of black ---- */
  button[type="submit"] {
    margin-top: 6px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #ffffff;
    background: #3a3a3a;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background .18s, transform .1s;
  }

  button[type="submit"]:hover  { background: #232323; }
  button[type="submit"]:active { transform: scale(.985); }
</style>
</head>
<body>

  <main class="card">
    <h1>Time Table</h1>
    <p class="sub">Enter your roll number and pick your semester</p>

    <!-- GET → time_table.html?roll=U25CS141&sem=III -->
    <form action="time_table.html" method="get" autocomplete="off">
      <label for="roll">College Roll Number</label>
      <input id="roll" name="roll" type="text" placeholder="e.g. U25CS141" required />

      <label for="sem">Semester</label>
      <select id="sem" name="sem" required>
        <option value="I">I</option>
        <option value="III">III</option>
        <option value="V">V</option>
        <option value="VII">VII</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </main>

</body>
</html>
